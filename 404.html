<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0f1115">
<title>404 · 页面走丢了 | 我才醒的神秘小站</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-color: #0f1115;
    background-image: url('/images/bg.jpg');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #e7edf7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    width: min(560px, 100%);
    padding: 40px 32px 36px;
    text-align: center;
    background: rgba(18, 24, 34, .82);
    border: 1px solid rgba(120, 140, 165, .28);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    backdrop-filter: blur(8px);
  }
  .code {
    margin: 0;
    font-size: clamp(72px, 18vw, 120px);
    line-height: 1;
    font-weight: 800;
    letter-spacing: .06em;
    background: linear-gradient(135deg, #7fb8ff, #b18cff 55%, #ff9ec7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 {
    margin: 18px 0 10px;
    font-size: 21px;
    font-weight: 600;
  }
  p {
    margin: 0 auto 28px;
    max-width: 36em;
    color: #aab6c6;
    font-size: 15px;
    line-height: 1.8;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  a.button {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 15px;
    text-decoration: none;
    transition: transform .18s ease, background .18s ease, border-color .18s ease;
  }
  a.primary {
    color: #0d1420;
    background: #7fb8ff;
    border: 1px solid #7fb8ff;
    font-weight: 600;
  }
  a.ghost {
    color: #d7e2f2;
    background: transparent;
    border: 1px solid rgba(127, 184, 255, .45);
  }
  a.button:hover { transform: translateY(-2px); }
  a.primary:hover { background: #a4cdff; border-color: #a4cdff; }
  a.ghost:hover { background: rgba(127, 184, 255, .16); }
  .hint {
    margin: 26px 0 0;
    font-size: 13px;
    color: #7f8c9e;
  }
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>这个页面不见了</h1>
    <p>链接可能写错了，或者文章已经被移动、删除。<br>不如回到首页，或者去归档里翻一翻。</p>
    <div class="actions">
      <a class="button primary" href="/">返回首页</a>
      <a class="button ghost" href="/archives/">浏览归档</a>
    </div>
    <p class="hint">我才醒的神秘小站</p>
  </main>
</body>
</html>
